name: Windows build

# Windows binaries cannot be built or tested on the maintainer's machine
# (Linux only), so CI is the feedback loop for the Windows port. Runs on
# demand; it is not cheap (Windows runners bill at 2x).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the release asset (default: build only)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'ModernGekko/**'
      - 'DolRecomp/**'
      # The packaging script and the shipped scaffolding are part of what this
      # workflow produces. Leaving them out meant a fix to the packaging script
      # pushed cleanly, triggered nothing, and looked green against the PREVIOUS
      # run's result.
      #
      # Named individually rather than '.github/scripts/**'. The glob woke a
      # windows-2022 runner -- billed at 2x, ~28 minutes -- for every change to
      # a Deck or Linux script that Windows never reads. These are the only two
      # this job actually consumes; add to the list when that stops being true.
      - '.github/workflows/windows.yml'
      - '.github/scripts/package-windows.ps1'
      - '.github/scripts/ringout.iss'
      - 'dist/RingOut-1.0-dist/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Configure
        # Dolphin's own CMake drives the vendored tree. Qt and the tests are the
        # two things that pull in toolchain we do not have on the runner, and the
        # runtime is headless-capable, so both are off.
        run: >
          cmake -S ModernGekko -B build
          -G "Visual Studio 17 2022" -A x64
          -DENABLE_QT=OFF
          -DENABLE_TESTS=OFF
          -DENABLE_ANALYTICS=OFF
          -DENABLE_AUTOUPDATE=OFF

      - name: Build runtime
        run: cmake --build build --config Release --target moderngekko-run

      - name: Build recompiler
        run: cmake --build build --config Release --target dolrecomp

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Get-ChildItem -Path build -Recurse -Include moderngekko-run.exe,dolrecomp.exe |
            ForEach-Object { Copy-Item $_.FullName staging/ }
          Get-ChildItem staging

      - name: Publish binaries
        # Was an Actions artifact uploaded on EVERY push, which is what kept the
        # shared quota full and failed unrelated workflows' uploads. Same rolling
        # release as the bundle, so there is always a current Windows build with
        # a stable URL and nothing accumulating behind it.
        #
        # Uploading is now opt-in, via the dispatch's publish input. A push no
        # longer publishes by itself: "this built" and "everyone downloads this"
        # were the same event, and there was no way to exercise the workflow
        # without shipping the result.
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          7z a -tzip RingOut-windows-x64-binaries.zip ./staging/* > /dev/null
          gh release view windows-latest >/dev/null 2>&1 || \
            gh release create windows-latest --prerelease --title "Windows build (rolling)" \
              --notes "Built from ${GITHUB_SHA}." --target "$GITHUB_SHA"
          gh release upload windows-latest RingOut-windows-x64-binaries.zip --clobber

      # The release bundle carries a whole toolchain, so it is assembled here
      # rather than on a developer machine: llvm-mingw alone unpacks to ~2 GB.
      #
      # Only on demand or for a tag. At ~294 MB it is 59% of this private repo's
      # 500 MB artifact allowance ON ITS OWN, so uploading one per push cannot
      # fit however short the retention -- two pushes refill the quota, and the
      # upload that then fails is whichever workflow happens to finish next.
      # That is how the Steam Deck build started failing for a Windows reason.
      # The per-push value here is the binaries, which are 6 MB and still
      # uploaded every time.
      - name: Package release
        # Always on a manual run, publish or not: this is the only way
        # package-windows.ps1 ever gets exercised.
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          .github/scripts/package-windows.ps1 `
            -BinDir staging -RepoRoot (Get-Location).Path -OutDir package

      - name: Publish release asset
        # OPT-IN ONLY: a dispatch with publish=true. An earlier attempt gated
        # this on a tag ref, which was wrong -- this workflow has no tag trigger,
        # so that condition could never be true and the asset would never have
        # published at all. Do not reintroduce a tag gate without also adding
        # tags to `on.push`, and note that `paths` filters apply to tag pushes
        # too, so a tag on an existing commit usually matches nothing and the
        # run is skipped entirely.
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        # A GitHub RELEASE asset, not an Actions artifact. This bundle is ~294 MB
        # per build because it carries a whole toolchain, and at the 90-day
        # artifact default it exhausted the repo's shared artifact quota -- which
        # does not fail only the big upload, it fails EVERY workflow's uploads,
        # including the 22 MB Deck package. Release assets are outside that pool
        # and give a stable download URL.
        #
        # --clobber because re-uploading an existing asset name is an error,
        # not a replace.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"; title="Ring Out $tag (Windows)"; extra=""
          else
            tag="windows-latest"; title="Windows build (rolling)"; extra="--prerelease"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" $extra --title "$title" \
              --notes "Built from ${GITHUB_SHA}." --target "$GITHUB_SHA"
          gh release upload "$tag" \
            package/RingOut-1.0-windows-x64-setup.exe \
            package/RingOut-1.0-windows-x64.zip --clobber

      # A failed configure/build leaves the useful detail in these logs rather
      # than in the step output.
      - name: Upload CMake logs on failure
        if: failure()
        # continue-on-error: this is diagnostics. When the artifact quota is full
        # this upload fails too, and a FAILED upload of failure logs was itself
        # being reported as the job's failure -- hiding the real one underneath.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cmake-logs
          retention-days: 7
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
          if-no-files-found: ignore
