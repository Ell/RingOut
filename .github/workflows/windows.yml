name: Windows build

# Windows binaries cannot be built or tested on the maintainer's machine
# (Linux only), so CI is the feedback loop for the Windows port. Runs on
# demand; it is not cheap (Windows runners bill at 2x).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ModernGekko/**'
      - 'DolRecomp/**'
      # The packaging script and the shipped scaffolding are part of what this
      # workflow produces. Leaving them out meant a fix to the packaging script
      # pushed cleanly, triggered nothing, and looked green against the PREVIOUS
      # run's result.
      - '.github/workflows/windows.yml'
      - '.github/scripts/**'
      - 'dist/RingOut-1.0-dist/**'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Configure
        # Dolphin's own CMake drives the vendored tree. Qt and the tests are the
        # two things that pull in toolchain we do not have on the runner, and the
        # runtime is headless-capable, so both are off.
        run: >
          cmake -S ModernGekko -B build
          -G "Visual Studio 17 2022" -A x64
          -DENABLE_QT=OFF
          -DENABLE_TESTS=OFF
          -DENABLE_ANALYTICS=OFF
          -DENABLE_AUTOUPDATE=OFF

      - name: Build runtime
        run: cmake --build build --config Release --target moderngekko-run

      - name: Build recompiler
        run: cmake --build build --config Release --target dolrecomp

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Get-ChildItem -Path build -Recurse -Include moderngekko-run.exe,dolrecomp.exe |
            ForEach-Object { Copy-Item $_.FullName staging/ }
          Get-ChildItem staging

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ringout-windows-x64
          path: staging/
          retention-days: 14
          if-no-files-found: error

      # The release bundle carries a whole toolchain, so it is assembled here
      # rather than on a developer machine: llvm-mingw alone unpacks to ~2 GB.
      #
      # Only on demand or for a tag. At ~294 MB it is 59% of this private repo's
      # 500 MB artifact allowance ON ITS OWN, so uploading one per push cannot
      # fit however short the retention -- two pushes refill the quota, and the
      # upload that then fails is whichever workflow happens to finish next.
      # That is how the Steam Deck build started failing for a Windows reason.
      # The per-push value here is the binaries, which are 6 MB and still
      # uploaded every time.
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          .github/scripts/package-windows.ps1 `
            -BinDir staging -RepoRoot (Get-Location).Path -OutDir package

      - name: Upload release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ringout-windows-release
          path: |
            package/RingOut-1.0-windows-x64-setup.exe
            package/RingOut-1.0-windows-x64.zip
          if-no-files-found: error
          compression-level: 0   # both are already compressed
          # ~294 MB per push, because the bundle carries a whole toolchain. At
          # the 90-day default that is what exhausted the repo's artifact quota
          # and started failing OTHER workflows' uploads. Keep two weeks' worth.
          retention-days: 14

      # A failed configure/build leaves the useful detail in these logs rather
      # than in the step output.
      - name: Upload CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cmake-logs
          retention-days: 7
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
          if-no-files-found: ignore
